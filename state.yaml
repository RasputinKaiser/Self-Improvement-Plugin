notes:
  - "Task dependencies and Memory Fabric edges are physically and semantically separate domains."
  - "events.jsonl is append-only authority; head.json is the external anchor and snapshot.json is rebuildable."
  - "Unknown provider usage is charged at reservation and cannot support efficiency or promotion claims."
  - "Every lesson is journaled as candidate/verify_before_use before any active Memory Fabric write."
  - "Source, installed-cache, configuration, child-process, and fresh-host proof layers are reported separately."
  - "The Goal Board derives observe/plan/execute/verify/record phases and a proof-aware recommendation; this is presentation guidance, never runtime control authority."
  - "The campaign fleet is an event-backed metadata spine: archive requires a terminal child outcome, reopen creates a fresh incarnation, and neither claims to mutate an external host conversation."
  - "A runtime board joins a campaign only from explicit metadata.campaign_id; missing or stale campaign lookup is reported as an optional-join error, not hidden."
  - "Canonical SIPS state resolves SIPS_HOME or ~/.codex/sips; retired NCODE_HOME is ignored so runtime, campaigns, goals, and fan-out do not split across homes."
  - "The official 0.4.0 cache was refreshed after source validation; child-process tools/list exposes 21 tools with zero missing enabled tools."
  - "The Goal Board now labels legacy subtask cards with their actionable descriptions, excludes legacy done cards from ready_task_ids, and exposes persisted-state provenance plus the separate current-task MCP boundary."
  - "The bounded Goal Board continuity objective was completed with a 4/4 legacy board projection and a source-backed Memory Fabric lesson."
  - "The /retro command is evidence-gated, writes provenance-backed learning records, and keeps the separately owned transcript miner out of the SIPS source tree."
  - "The refreshed installed-cache child process routes a retrospective task to /retro with homebase_recall, homebase_record, task_outcome_tracker.py, and recall_ranker.py; the already-open native task may still need rediscovery."
